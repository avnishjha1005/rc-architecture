name: Website checks and deployment

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy ${{ github.ref_name }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    concurrency:
      group: rc-architecture-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            npm run build:production
          else
            npm run build:staging
          fi
      - name: Publish the current branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: f41a12dc85b688fb299f568ee3d323c2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$sha" != "$GITHUB_SHA" ]]; then echo "Skipping superseded commit $GITHUB_SHA"; exit 0; fi
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the GitHub deployment environment}"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            npx --no-install opennextjs-cloudflare deploy
          else
            npx --no-install opennextjs-cloudflare deploy --env staging
          fi
