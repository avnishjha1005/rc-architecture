name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        if: github.event_name == 'pull_request'
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: rc-architecture-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CHISEL_ENABLED: "1"
          NEXT_PUBLIC_SANITY_PROJECT_ID: dlbl0h64
          NEXT_PUBLIC_SANITY_DATASET: production
      - name: Check that this is still the tip of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$sha" == "$GITHUB_SHA" ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
      - name: Publish to rc-architecture
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: f41a12dc85b688fb299f568ee3d323c2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the GitHub Production environment}"
          npx --no-install opennextjs-cloudflare deploy
